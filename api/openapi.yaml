          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          nullable: true
          format: date-time
          description: null for a draft; set once by successful submit and preserved on repeated submit.
        availableActions:
          type: array
          items:
            type: string
            enum:
            - edit
            - submit
            - accept
            - decline
          description: '[edit, submit] for draft; [accept, decline] in approved/counter_offer only with a current
            active offer; [] otherwise. Submit availability does not imply successful validation; completeness and
            mandatory documents are checked by POST submit.'
      description: Заявка сохраняет creator userId и companyId отдельно; чужой draft скрыт. Доступ проверяется по
