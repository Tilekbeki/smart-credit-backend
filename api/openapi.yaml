  /api/v1/bank/applications/{applicationId}/decisions:
    parameters:
    - $ref: '#/components/parameters/BankApplicationId'
    post:
      x-implementation-status: implemented
      security:
      - BearerAuth: []
      operationId: createManualCreditDecision
      summary: Record an employee decision for a manual-review application
      description: BANK_EMPLOYEE only. Server-side access excludes drafts regardless of knowing their UUID. Bank
        visibility starts only after successful submit. Only manual_review may be decided. A draft is hidden with
        404 application_not_found, before state validation. Current application version and a trimmed 1..1000-character
        internal comment are required. approved preserves submitted amount/term; counter_offer amount cannot exceed
        requested amount, both conditions satisfy frozen product limits, and at least one changes. Frozen rate and
        product are unchanged; backend calculates the payment and validates it against the frozen financial budget
        and hard product limits. All decisions require the offer property; rejected requires offer=null. Employee
        identity comes from authentication, not JSON. Application/decision/offer/event/idempotency result commit
        in one transaction with application locking. Same key and canonical typed body replay original 201 before
        stale-version validation; changed body gives 409 idempotency_conflict. Keys live 24 hours; state/version
        constraints still prevent repeating the decision after expiry. Manual approval does not redefine the scoring
        result or original risk assessment.
      x-roles:
      - BANK_EMPLOYEE
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualDecisionInput'
            examples:
              approved:
                value:
                  version: 7
                  decision: approved
                  comment: Проверка завершена, исходные условия подтверждены.
                  offer:
                    amountRub: 1000000
                    termMonths: 24
              counterOffer:
                value:
                  version: 7
                  decision: counter_offer
                  comment: Предлагаю уменьшить сумму до 800 тысяч рублей.
                  offer:
                    amountRub: 800000
                    termMonths: 24
              rejected:
                value:
                  version: 7
                  decision: rejected
                  comment: Представленных сведений недостаточно для одобрения.
                  offer: null
      responses:
        '201':
          description: Manual decision and optional active offer created; same key/body replays this result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditDecision'
              example:
                applicationId: 40000000-0000-4000-8000-000000000001
                status: counter_offer
                version: 8
                decision: counter_offer
                score: 62
                riskLevel: MEDIUM
                reasons:
                - Предложена меньшая сумма кредита.
                assessedAt: '2026-10-24T10:05:00Z'
                reviewedBy: 20000000-0000-4000-8000-000000000004
                offer:
                  offerId: 60000000-0000-4000-8000-000000000001
                  applicationId: 40000000-0000-4000-8000-000000000001
                  productId: turnover
                  amountRub: 800000
                  termMonths: 24
                  annualRatePercent: 22
                  monthlyPaymentRub: 41503
                  expiresAt: null
                  status: active
                processing: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          $ref: '#/components/responses/DecisionConflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Invalid manual business conditions or comment (validation_failed)
          content:
