        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Trimmed nonblank text, at most 300 Unicode characters, no NUL. null clears the description.
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        companyId:
          type: string
          format: uuid
          description: Явный выбор из GET /me/companies; при единственном активном членстве можно опустить. Null
            запрещён. Сам UUID не предоставляет доступ.
          nullable: false
