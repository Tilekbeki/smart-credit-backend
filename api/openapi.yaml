        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
