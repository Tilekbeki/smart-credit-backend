openapi: 3.0.3
info:
  title: Smart Credit Go backend
  version: 1.1.0
  description: 'Демонстрационный кредитный конвейер. 41 реализованная операция: многокомпанейное членство, раздельные
    контактные и подтверждаемые данные, финансовое происхождение, документы, сохранённый Python scoring и Go-политика.
    APP_ENV=demo явно включает синтетические интеграции; production-запуск закрыт до подключения настоящей идентификации,
    реестров, БКИ и подписания. JWT идентифицирует пользователя, доступ определяется актуальным членством PostgreSQL.
    Старые снимки и решения не пересчитываются. signed — демонстрационное подтверждение без выдачи денег.'
x-application-lifecycle:
  transitions:
  - from: draft
    to: submitted
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/submit
    implementation: implemented
  - from: submitted
    to: processing
    actor: WORKER
    implementation: implemented
  - from: processing
    to:
    - approved
    - counter_offer
    - rejected
    - manual_review
    actor: GO_CREDIT_POLICY
    implementation: implemented
  - from: manual_review
    to:
    - approved
    - counter_offer
    - rejected
    actor: BANK_EMPLOYEE
    via: POST /api/v1/bank/applications/{applicationId}/decisions
    implementation: implemented
  - from:
    - approved
    - counter_offer
    to: signed
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/accept
    implementation: implemented
  - from:
    - approved
    - counter_offer
    to: closed
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/decline
    implementation: implemented
  terminalStates:
  - rejected
  - signed
  - closed
  technicalFailure: Retain submitted/processing. Decision and bank assessment APIs expose a safe Processing state
    without private job errors. awaiting_scoring and awaiting_decision are internal job states, never application
    statuses.
  signedMeaning: MVP demonstration confirmation only; no loan disbursement or legally binding bank agreement.
x-bank-draft-policy:
  visibilityStartsAt: successful submit
  draftListResult: never included; status=draft returns 400 invalid_request
  draftReadResult: 404 application_not_found for all bank reads, including existing document list/download
  draftCountLimit: none for CLIENT; several independent drafts per product allowed
servers:
- url: http://localhost:8080
paths:
  /health:
    get:
      x-implementation-status: implemented
      operationId: health
      x-roles: []
      summary: Process liveness; does not query PostgreSQL
      responses:
        '200':
          description: The HTTP process is running
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                    enum:
                    - backend
  /ready:
    get:
      x-implementation-status: implemented
      operationId: readiness
      x-roles: []
      summary: Checks PostgreSQL connectivity within DB_PING_TIMEOUT
      responses:
        '200':
          description: PostgreSQL is reachable; does not verify migration version
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: PostgreSQL is unavailable or the check timed out
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - error
                properties:
                  status:
                    type: string
                    enum:
                    - not_ready
                  error:
                    type: string
                    enum:
                    - database_unavailable
  /api/v1/demo/profiles:
    get:
      x-implementation-status: implemented
      operationId: listDemoProfiles
      x-roles: []
      summary: List the four seeded synthetic users from PostgreSQL
      description: Three CLIENT profiles and one BANK_EMPLOYEE profile. Authentication is not required.
      responses:
        '200':
          description: Available demonstration profiles; phone numbers are synthetic and displayable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoProfilesResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/request:
    post:
      x-implementation-status: implemented
      operationId: requestDemoOTP
      x-roles: []
      summary: Create an OTP challenge and simulate sending an SMS
      description: 'Uses the selected user''s stored phone number. The challenge expires after five

        minutes and allows at most five verification attempts. Creating a new challenge

        invalidates that user''s previous active challenges atomically. The code is never

        returned or logged; no real SMS is sent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestInput'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The selected profile does not exist (profile_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/verify:
    post:
      x-implementation-status: implemented
      operationId: verifyDemoOTP
      x-roles: []
      summary: Consume a valid OTP and issue an eight-hour access token
      description: 'Code comparison, attempt limits and single use are enforced atomically in

        PostgreSQL. A valid code on the fifth attempt succeeds; after five incorrect

        attempts the challenge is blocked. A consumed, expired, superseded or blocked

        challenge cannot issue a token. Role and company come from the stored user.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyInput'
      responses:
        '200':
          description: OTP consumed and JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
        '400':
          description: Malformed input (invalid_request) or an incorrect code (invalid_otp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Challenge does not exist (otp_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Challenge was already consumed (otp_used) or superseded (otp_invalidated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Challenge has expired (otp_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Five failed verification attempts exhausted the challenge (otp_attempts_exceeded); request
            a new OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      x-implementation-status: implemented
      operationId: getCurrentUser
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: Return the authenticated user from PostgreSQL
      description: 'Requires an HS256 JWT with a valid signature, expiration, issuer and audience.

        Its subject identifies the user; role and company are loaded from PostgreSQL

        on each authenticated request instead of trusting client input or JWT role claims.

        '
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, malformed, invalid or expired token, or unknown user (unauthorized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchMyProfile
      summary: Изменить отображаемое имя и дополнительный email
      description: 'Проверка текущих полномочий в PostgreSQL. Неизвестные поля, null, дубликаты ключей и неверный
        UTF-8 запрещены. version — текущая версия изменяемой записи; для изменений компании — GET компании. При
        конфликте 409 version_conflict. Повторяемые операции требуют UUID Idempotency-Key: точный повтор воспроизводит
        ответ, другое тело даёт 409 idempotency_conflict. Аудит и изменения атомарны.'
      x-implementation-status: implemented
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Успешная операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: company_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict / invalid_status / idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: unsupported_media_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: service_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchInput'
  /api/v1/companies/{companyId}:
    get:
      x-implementation-status: implemented
      operationId: getOwnCompany
      x-roles:
      - CLIENT
      summary: Получить компанию с действующим членством
      description: Действующее членство в компании проверяется по PostgreSQL. VIEWER может читать сведения. Чужая
        компания возвращает 403 без раскрытия существования. Источники и время подтверждения финансов не означают
        реальную банковскую проверку в demo.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Own company was not found (company_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID доступной компании; не ограничивается совместимым companyId из /me.
    patch:
      operationId: patchCompanyContacts
      summary: Изменить контакты компании
      description: 'Проверка текущих полномочий в PostgreSQL. Неизвестные поля, null, дубликаты ключей и неверный
        UTF-8 запрещены. version — текущая версия изменяемой записи; для изменений компании — GET компании. При
        конфликте 409 version_conflict. Повторяемые операции требуют UUID Idempotency-Key: точный повтор воспроизводит
        ответ, другое тело даёт 409 idempotency_conflict. Аудит и изменения атомарны.'
      x-implementation-status: implemented
      x-roles:
      - CLIENT
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Успешная операция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyContactPatchResponse'
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: company_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict / invalid_status / idempotency_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: unsupported_media_type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: service_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyContactPatchInput'
  /api/v1/credit-products:
    get:
      x-implementation-status: implemented
      operationId: listCreditProducts
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: List active synthetic credit products
      description: CLIENT and BANK_EMPLOYEE. Products and conditions are read from PostgreSQL. No product is created
        by this request.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProductsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credit-products/{productId}:
    get:
      x-implementation-status: implemented
      operationId: getCreditProduct
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: Get an active product by public code
      description: CLIENT and BANK_EMPLOYEE. The path uses turnover/investment codes, not UUIDs. Conditions are
        synthetic, not actual bank offers.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: Unknown or inactive product (product_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
        example: turnover
  /api/v1/recommendations:
    post:
      x-implementation-status: implemented
      operationId: recommendFinancing
      x-roles:
      - CLIENT
      summary: Calculate an explainable preliminary financing selection
      description: CLIENT only. The company and existing monthly debt payments come from PostgreSQL. Request revenue/expenses
        override the company figures for this calculation only and are not persisted. Uses exact rational arithmetic;
        monthly payments are rounded up, budgets and available amounts down to whole rubles. A valid request without
        eligible products returns 200 with recommendedProductId=null and explanations. Suggested amount/term corrections
        must be explicitly resubmitted to become the selected request. This endpoint does not call Python scoring,
        create a credit decision, application or background job, or modify any status.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'company_required: выберите компанию явно'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
  /api/v1/applications:
    post:
      x-implementation-status: implemented
      operationId: createApplicationDraft
      x-roles:
      - CLIENT
      summary: Create a partial client-owned credit draft
      description: CLIENT only. Owner and company come from the current PostgreSQL user; they must not be supplied
        in JSON. An empty object or nullable editable fields are accepted. Provided values must be valid; when productId
        is selected, any present purpose, amount and term must satisfy that active product. Creation and draft_created
        event are committed atomically. No scoring, decision or background job is created. Multiple independent
        drafts, including drafts of the same product, are allowed without an MVP count limit. Submitting one never
        submits or deletes the others.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDraftInput'
            examples:
              empty:
                summary: Save an empty draft
                value: {}
              partial:
                summary: Persist selected product and parameters
                value:
                  productId: turnover
                  purpose: stock
                  requestedAmountRub: 1500000
                  termMonths: 12
      responses:
        '201':
          description: Draft and first timeline event created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
              example:
                applicationId: 40000000-0000-4000-8000-000000000001
                userId: 20000000-0000-4000-8000-000000000001
                companyId: 10000000-0000-4000-8000-000000000001
                productId: turnover
                purpose: stock
                purposeDescription: null
                requestedAmountRub: 1500000
                termMonths: 12
                monthlyRevenueRub: 2400000
                monthlyExpensesRub: 1500000
                productName: Оборотный кредит
                status: draft
                version: 1
                createdAt: '2026-10-23T12:00:00Z'
                updatedAt: '2026-10-23T12:00:00Z'
                submittedAt: null
                availableActions:
                - edit
                - submit
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: company_not_found для недоступного селектора компании либо product_not_found для продукта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '409':
          description: 'company_required: выберите компанию явно'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      x-implementation-status: implemented
      operationId: listOwnApplications
      x-roles:
      - CLIENT
      summary: Доступные заявки с фильтром компании
      description: 'CLIENT: собственные черновики и отправленные заявки компаний с действующим членством. companyId
        сужает выборку; чужой фильтр даёт пустую страницу. Порядок createdAt DESC/applicationId DESC, total после
        фильтров до пагинации. Неизвестные и повторные параметры отклоняются.'
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: companyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Фильтр по доступной компании. Без фильтра — все доступные отправленные заявки и собственные
          приватные черновики.
      responses:
        '200':
          description: Matching applications and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}:
    parameters:
    - name: applicationId
      in: path
      required: true
      description: Nonzero application UUID. Ownership is checked using both authenticated user ID and company ID.
      schema:
        type: string
        format: uuid
    get:
      x-implementation-status: implemented
      operationId: getOwnApplication
      x-roles:
      - CLIENT
      summary: Open the current client’s saved application
      description: 'CLIENT: требуется действующее членство; чужой draft скрыт даже от коллег компании. Missing and
        foreign UUIDs both return 404 application_not_found without disclosing existence. Includes permitted company
        details and the selected product summary. Draft availableActions is [edit, submit]; approved/counter_offer
        expose [accept, decline] only while the current offer is active. Other client states expose []. Submit still
        validates completeness and documents.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Saved application with company and product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      x-implementation-status: implemented
      operationId: patchApplicationDraft
      x-roles:
      - CLIENT
      summary: Edit a draft using optimistic locking
      description: CLIENT owner only. Positive non-null version and at least one editable field are required. An
        absent field is unchanged; an explicit null clears that editable field. Immutable/unknown fields are rejected.
        Validation uses the merged draft and the selected active product. A successful PATCH, including assignment
        of an existing value, increments version exactly once and appends draft_updated in the same transaction.
        Stale/concurrent versions return 409 version_conflict; a non-draft application returns 409 invalid_status.
        Neither error changes the draft or timeline.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatchInput'
            example:
              version: 1
              requestedAmountRub: 1800000
              purposeDescription: null
