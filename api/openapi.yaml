      - maxAmountRub
      - minTermMonths
      - maxTermMonths
      - annualRatePercent
      - minBusinessAgeMonths
      - version
      - illustrative
      properties:
        id:
          type: string
          description: Stable public code; internal PostgreSQL UUID is not exposed.
          enum:
          - turnover
          - investment
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
            enum:
            - stock
            - expenses
            - seasonal
            - equipment
            - upgrade
        minAmountRub:
          type: integer
          format: int64
          minimum: 1
        maxAmountRub:
          type: integer
          format: int64
          minimum: 1
        minTermMonths:
          type: integer
          format: int64
          minimum: 1
        maxTermMonths:
          type: integer
          format: int64
          minimum: 1
        annualRatePercent:
          type: number
          minimum: 0
          description: Annual percent, e.g. 22; serialized as a JSON number, not a string.
        minBusinessAgeMonths:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
        illustrative:
          type: boolean
          enum:
          - true
    CreditProductsResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditProduct'
    RecommendationInput:
      type: object
      required:
      - purpose
      - requestedAmountRub
      - termMonths
      - monthlyRevenueRub
      - monthlyExpensesRub
      properties:
        purpose:
          type: string
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          description: 'Допустимая цель из каталога продукта: stock/expenses/seasonal/equipment/upgrade. other запрещён.'
        requestedAmountRub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        termMonths:
          type: integer
          format: int64
          minimum: 1
          maximum: 120
        monthlyRevenueRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        companyId:
          type: string
          format: uuid
          description: Явный выбор из GET /me/companies; при единственном активном членстве можно опустить. Null
            запрещён. Сам UUID не предоставляет доступ.
          nullable: false
      additionalProperties: false
      description: All five fields are required, non-null. Amounts are integer rubles. companyId is forbidden; the
        company comes from the authenticated user.
      example:
        purpose: stock
        requestedAmountRub: 1500000
        termMonths: 12
        monthlyRevenueRub: 2400000
        monthlyExpensesRub: 1500000
    ProductMatches:
      type: object
      required:
      - purpose
      - amount
      - term
      - businessAge
      - affordability
      properties:
        purpose:
          type: boolean
        amount:
          type: boolean
        term:
          type: boolean
        businessAge:
          type: boolean
        affordability:
          type: boolean
          description: True when the term is allowed and the requested rounded monthly payment does not exceed the
            budget; independent of purpose, amount bounds and business age.
    FinancingAdjustment:
      type: object
      required:
      - amountRub
      - termMonths
      - monthlyPaymentRub
      - explanation
      properties:
        amountRub:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          format: int64
          minimum: 1
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 0
        explanation:
          type: string
    ProductRecommendation:
      type: object
      required:
      - product
      - matches
      - eligible
      - preliminaryAvailableAmountRub
      - monthlyPaymentRub
      - reasons
      - limitations
      - adjustments
      properties:
        product:
          $ref: '#/components/schemas/CreditProduct'
        matches:
          $ref: '#/components/schemas/ProductMatches'
        eligible:
          type: boolean
          description: All five matches are true for the original request. An adjustment does not make the original
            request eligible.
        preliminaryAvailableAmountRub:
          type: integer
          format: int64
          minimum: 0
          description: floor(paymentBudget / annuityCoefficient), capped at product maximum; zero if requested term
            is outside the product limits. Does not itself indicate eligibility.
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Annuity payment rounded up to the next whole ruble; null if requested term is outside the
            product limits.
        reasons:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/FinancingAdjustment'
    RecommendationResponse:
      type: object
      required:
      - companyId
      - businessAgeMonths
      - surplusRub
      - existingMonthlyPaymentsRub
      - paymentBudgetRub
      - products
      - recommendedProductId
      - disclaimer
      - simulation
      - financialVerificationRequired
      properties:
        companyId:
          type: string
          format: uuid
        businessAgeMonths:
          type: integer
          format: int64
          minimum: 0
          description: Completed UTC calendar months since registration, with end-of-month day clamping.
        surplusRub:
          type: integer
          format: int64
          description: Requested monthly revenue minus requested monthly expenses; may be negative.
        existingMonthlyPaymentsRub:
          type: integer
          format: int64
          minimum: 0
          description: Existing monthly debt payments loaded from the company in PostgreSQL.
        paymentBudgetRub:
          type: integer
          format: int64
          minimum: 0
          description: floor(max(0, 0.5 * surplusRub - existingMonthlyPaymentsRub)).
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRecommendation'
        recommendedProductId:
          type: string
          nullable: true
          description: Eligible product with the lowest monthly payment, then lexicographic product ID; null when
            none is eligible. Suggested adjustments are not automatically selected.
        disclaimer:
          type: string
        simulation:
          type: boolean
          enum:
          - true
        financialVerificationRequired:
          type: boolean
          description: Заявленные суммы требуют проверки; бюджет ограничен исходными сведениями компании.
    ApplicationStatus:
      type: string
      enum:
      - draft
      - submitted
      - processing
      - manual_review
      - approved
      - rejected
      - counter_offer
      - signed
      - closed
      description: Create and PATCH work with draft. Submit advances draft to submitted; the worker advances it
        to processing, saves scoring and applies Go policy to produce approved, rejected, counter_offer or manual_review.
        A bank employee resolves manual_review; CLIENT accept/decline transitions an active approved/counter_offer
        proposal to signed/closed respectively; technical errors are stored separately and never imply a credit
        refusal.
