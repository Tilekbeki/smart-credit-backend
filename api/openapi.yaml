        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMetadata'
    BankApplicationStatus:
      type: string
      enum:
      - submitted
      - processing
      - manual_review
      - approved
      - counter_offer
      - rejected
      - signed
      - closed
      description: Only submitted applications are visible to BANK_EMPLOYEE. draft is never a bank-visible state.
    RiskLevel:
      type: string
      nullable: true
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - null
      description: Demo risk category assigned by Go backend policy. Higher score means lower risk; LOW for score
        >= 80, MEDIUM for 50 <= score < 80, HIGH for score < 50. null means not available.
    CreditOutcome:
      type: string
      nullable: true
      enum:
      - approved
      - counter_offer
      - rejected
      - null
      description: Final credit decision made by Go backend; scoring recommendations are not final decisions. null
        before a final decision, including manual_review.
    CreditOffer:
      type: object
      additionalProperties: false
      required:
      - offerId
      - applicationId
      - productId
      - amountRub
      - termMonths
      - annualRatePercent
      - monthlyPaymentRub
      - expiresAt
      - status
      properties:
        offerId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        productId:
          type: string
          enum:
          - turnover
          - investment
          description: Public product code; not the internal product UUID.
        amountRub:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
        annualRatePercent:
          type: number
          minimum: 0
          description: 'Fixed annual rate in percent: 22 means 22%, not 0.22. The frozen product rate is used.'
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 1
          description: Integer rubles, calculated by backend using the frozen product conditions.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Always null in MVP; offer expiry and expiry processing are not implemented.
        status:
          type: string
          enum:
          - active
          - accepted
          - withdrawn
      description: One current primary offer. Null when no offer exists; rejected decisions have no offer. All monetary
        amounts are integer rubles.
      nullable: true
    Processing:
      type: object
      additionalProperties: false
      required:
      - stage
      - state
      - retryAt
      - message
      properties:
        stage:
          type: string
          enum:
          - prechecks
          - scoring
          - decision
        state:
          type: string
          enum:
          - waiting
          - running
          - retrying
          - failed
        retryAt:
          type: string
          format: date-time
          nullable: true
          description: Scheduled automatic retry, or null.
        message:
          type: string
          nullable: true
          description: Safe user-facing message. Never contains raw errors, SQL, addresses, lease data or scoring
            payloads.
      description: Normalized background-processing state. Null for drafts, final states and manual_review. A technical
        failure never implies a rejected credit decision.
      nullable: true
    CreditDecision:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - status
      - version
      - decision
      - score
      - riskLevel
      - reasons
      - assessedAt
      - reviewedBy
      - offer
      - processing
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Application revision used for optimistic locking; not a decision, product or offer version.
        decision:
          $ref: '#/components/schemas/CreditOutcome'
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Python scoring integer scale 0..100; higher score means lower risk in the demo policy. LOW
            >= 80, MEDIUM 50..79, HIGH < 50. null means not available, not zero.
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        reasons:
          type: array
          items:
            type: string
          description: Safe client-facing reasons generated by backend. Private employee comments are not exposed
            here.
        assessedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of final credit decision creation; null until a final decision exists.
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: Acting employee UUID for a manual final decision, otherwise null.
        offer:
          $ref: '#/components/schemas/CreditOffer'
        processing:
          $ref: '#/components/schemas/Processing'
      description: Представление решения доступной по членству заявки; чужой draft скрыт. manual_review has decision=null
        and processing=null; score and riskLevel may be present. signed/closed preserve the last credit decision.
        Declining a proposal does not turn the bank decision into rejected. Score examples are synthetic and do
        not define risk thresholds.
