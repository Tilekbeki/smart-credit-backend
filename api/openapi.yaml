openapi: 3.0.3
info:
  title: Smart Credit Go backend
  version: 0.4.0
  description: 'Demonstration authentication, own-company data, synthetic credit products and preliminary
    financing selection for a hackathon. DEMO_OTP_CODE defaults to 1234; no SMS is sent. Public profile
    selection includes a bank employee and must not be used for production access. Product conditions
    and company data are synthetic and are not actual Alfa-Bank offers. Recommendations neither create
    applications nor constitute or guarantee credit decisions; Python scoring is not called. All responses
    use Cache-Control: no-store. CLIENT users can persist partial credit drafts and inspect their history;
    draft APIs do not submit applications, call scoring or enqueue processing.'
servers:
- url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      summary: Process liveness; does not query PostgreSQL
      responses:
        '200':
          description: The HTTP process is running
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                    enum:
                    - backend
  /ready:
    get:
      operationId: readiness
      summary: Checks PostgreSQL connectivity within DB_PING_TIMEOUT
      responses:
        '200':
          description: PostgreSQL is reachable; does not verify migration version
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: PostgreSQL is unavailable or the check timed out
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - error
                properties:
                  status:
                    type: string
                    enum:
                    - not_ready
                  error:
                    type: string
                    enum:
                    - database_unavailable
  /api/v1/demo/profiles:
    get:
      operationId: listDemoProfiles
      summary: List the four seeded synthetic users from PostgreSQL
      description: Three CLIENT profiles and one BANK_EMPLOYEE profile. Authentication is not required.
      responses:
        '200':
          description: Available demonstration profiles; phone numbers are synthetic and displayable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoProfilesResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/request:
    post:
      operationId: requestDemoOTP
      summary: Create an OTP challenge and simulate sending an SMS
      description: 'Uses the selected user''s stored phone number. The challenge expires after five

        minutes and allows at most five verification attempts. Creating a new challenge

        invalidates that user''s previous active challenges atomically. The code is never

        returned or logged; no real SMS is sent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestInput'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The selected profile does not exist (profile_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyDemoOTP
      summary: Consume a valid OTP and issue an eight-hour access token
      description: 'Code comparison, attempt limits and single use are enforced atomically in

        PostgreSQL. A valid code on the fifth attempt succeeds; after five incorrect

        attempts the challenge is blocked. A consumed, expired, superseded or blocked

        challenge cannot issue a token. Role and company come from the stored user.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyInput'
      responses:
        '200':
          description: OTP consumed and JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
        '400':
          description: Malformed input (invalid_request) or an incorrect code (invalid_otp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Challenge does not exist (otp_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Challenge was already consumed (otp_used) or superseded (otp_invalidated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Challenge has expired (otp_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Five failed verification attempts exhausted the challenge (otp_attempts_exceeded);
            request a new OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user from PostgreSQL
      description: 'Requires an HS256 JWT with a valid signature, expiration, issuer and audience.

        Its subject identifies the user; role and company are loaded from PostgreSQL

        on each authenticated request instead of trusting client input or JWT role claims.

        '
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, malformed, invalid or expired token, or unknown user (unauthorized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/companies/{companyId}:
    get:
      operationId: getOwnCompany
      summary: Get the authenticated client’s own company
      description: CLIENT only. Company ownership is checked before reading details. BANK_EMPLOYEE and
        access to another company return 403; no foreign company existence is disclosed. All legal and
        contact details are synthetic.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Own company was not found (company_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Nonzero UUID matching the authenticated user’s companyId.
  /api/v1/credit-products:
    get:
      operationId: listCreditProducts
      summary: List active synthetic credit products
      description: CLIENT and BANK_EMPLOYEE. Products and conditions are read from PostgreSQL. No product
        is created by this request.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProductsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credit-products/{productId}:
    get:
      operationId: getCreditProduct
      summary: Get an active product by public code
      description: CLIENT and BANK_EMPLOYEE. The path uses turnover/investment codes, not UUIDs. Conditions
        are synthetic, not actual bank offers.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: Unknown or inactive product (product_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
        example: turnover
  /api/v1/recommendations:
    post:
      operationId: recommendFinancing
      summary: Calculate an explainable preliminary financing selection
      description: CLIENT only. The company and existing monthly debt payments come from PostgreSQL. Request
        revenue/expenses override the company figures for this calculation only and are not persisted.
        Uses exact rational arithmetic; monthly payments are rounded up, budgets and available amounts
        down to whole rubles. A valid request without eligible products returns 200 with recommendedProductId=null
        and explanations. Suggested amount/term corrections must be explicitly resubmitted to become the
        selected request. This endpoint does not call Python scoring, create a credit decision, application
        or background job, or modify any status.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
  /api/v1/applications:
    post:
      operationId: createApplicationDraft
      summary: Create a partial client-owned credit draft
      description: CLIENT only. Owner and company come from the current PostgreSQL user;
        they must not be supplied in JSON. An empty object or nullable editable fields
        are accepted. Provided values must be valid; when productId is selected, any
        present purpose, amount and term must satisfy that active product. Creation
        and draft_created event are committed atomically. No scoring, decision or background
        job is created.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDraftInput'
            examples:
              empty:
                summary: Save an empty draft
                value: {}
              partial:
                summary: Persist selected product and parameters
                value:
                  productId: turnover
                  purpose: stock
                  requestedAmountRub: 1500000
                  termMonths: 12
      responses:
        '201':
          description: Draft and first timeline event created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
              example:
                applicationId: 40000000-0000-4000-8000-000000000001
                userId: 20000000-0000-4000-8000-000000000001
                companyId: 10000000-0000-4000-8000-000000000001
                productId: turnover
                purpose: stock
                purposeDescription: null
                requestedAmountRub: 1500000
                termMonths: 12
                monthlyRevenueRub: 2400000
                monthlyExpensesRub: 1500000
                productName: Оборотный кредит
                status: draft
                version: 1
                createdAt: '2026-10-23T12:00:00Z'
                updatedAt: '2026-10-23T12:00:00Z'
                submittedAt: null
                availableActions:
                - edit
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Unknown or inactive product (product_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listOwnApplications
      summary: List applications owned by the current client in their company
      description: CLIENT only. SQL pagination and status filtering apply to both owner
        and company scope; other owners are never included. Ordered by createdAt descending,
        then applicationId descending. total counts all matching rows before pagination.
        Unknown/repeated query parameters and malformed limits, offsets or statuses
        are rejected. Existing non-draft states may be read, but Stage 4 only creates
        draft.
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Matching applications and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}:
    parameters:
    - name: applicationId
      in: path
      required: true
      description: Nonzero application UUID. Ownership is checked using both authenticated
        user ID and company ID.
      schema:
        type: string
        format: uuid
    get:
      operationId: getOwnApplication
      summary: Open the current client’s saved application
      description: CLIENT only, owner and company must match the current user. Missing
        and foreign UUIDs both return 404 application_not_found without disclosing existence.
        Includes permitted company details and the selected product summary. Draft availableActions
        is [edit]; submit is not available in Stage 4.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Saved application with company and product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchApplicationDraft
      summary: Edit a draft using optimistic locking
      description: CLIENT owner only. Positive non-null version and at least one editable
        field are required. An absent field is unchanged; an explicit null clears that
        editable field. Immutable/unknown fields are rejected. Validation uses the merged
        draft and the selected active product. A successful PATCH, including assignment
        of an existing value, increments version exactly once and appends draft_updated
        in the same transaction. Stale/concurrent versions return 409 version_conflict;
        a non-draft application returns 409 invalid_status. Neither error changes the
        draft or timeline.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatchInput'
            example:
              version: 1
              requestedAmountRub: 1800000
              purposeDescription: null
      responses:
        '200':
          description: Updated draft with incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Unknown/inactive product (product_not_found); for an application
            path, a missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: Stale version (version_conflict) or an application whose status
            is not draft (invalid_status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}/timeline:
    get:
      operationId: getApplicationTimeline
      summary: Read the ordered history of the current client’s application
      description: CLIENT owner only. Missing and foreign applications both return 404
        application_not_found. Events are ordered by increasing sequence. Stage 4 records
        draft_created and draft_updated with generic titles; timeline never contains
        OTP, JWT or editable financial values.
      security:
      - BearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: Nonzero application UUID. Ownership is checked using both authenticated
          user ID and company ID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ordered application events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTimeline'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by OTP verification; expires in eight hours
  schemas:
    Role:
      type: string
      enum:
      - CLIENT
      - BANK_EMPLOYEE
    DemoProfile:
      type: object
      required:
      - id
      - name
      - phone
      - role
      - companyName
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Иван Лавкин
        phone:
          type: string
          description: Synthetic phone number suitable for displaying in the demonstration UI
          example: '+79990000001'
        role:
          $ref: '#/components/schemas/Role'
        companyName:
          type: string
          nullable: true
          description: Null for BANK_EMPLOYEE
          example: ИП «Лавка у дома»
    DemoProfilesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoProfile'
    OTPRequestInput:
      type: object
      additionalProperties: false
      required:
      - profileId
      properties:
        profileId:
          type: string
          format: uuid
          description: Nonzero UUID of a seeded demonstration user
          example: 20000000-0000-4000-8000-000000000001
    OTPRequestResponse:
      type: object
      required:
      - otpRequestId
      - expiresAt
      - maskedPhone
      properties:
        otpRequestId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: UTC expiry, five minutes after challenge creation
        maskedPhone:
          type: string
          example: +7*** *** 0001
    OTPVerifyInput:
      type: object
      additionalProperties: false
      required:
      - otpRequestId
      - code
      properties:
        otpRequestId:
          type: string
          format: uuid
          description: Nonzero challenge UUID returned by requestDemoOTP
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Fixed demonstration OTP from DEMO_OTP_CODE; defaults to 1234
          example: '1234'
    OTPVerifyResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresAt
      - userId
      - role
      - companyId
      properties:
        accessToken:
          type: string
          description: Signed JWT; do not log it
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
          description: UTC token expiry, eight hours after issuance
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Null for BANK_EMPLOYEE
    CurrentUser:
      type: object
      required:
      - id
      - name
      - phone
      - role
      - companyId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          example: '+79990000001'
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Null for BANK_EMPLOYEE
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Stable machine-readable error code; role middleware returns forbidden with HTTP
            403
        message:
          type: string
          description: Safe human-readable explanation without database or credential details
      example:
        error: invalid_request
        message: Некорректный запрос
    CompanyContact:
      type: object
      required:
      - phone
      - email
      - address
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    CompanyFinancials:
      type: object
      required:
      - monthlyRevenueRub
      - monthlyExpensesRub
      - existingDebtRub
      - existingMonthlyPaymentsRub
      - overdueCount
      properties:
        monthlyRevenueRub:
          type: integer
          format: int64
          minimum: 0
        monthlyExpensesRub:
          type: integer
          format: int64
          minimum: 0
        existingDebtRub:
          type: integer
          format: int64
          minimum: 0
        existingMonthlyPaymentsRub:
          type: integer
          format: int64
          minimum: 0
        overdueCount:
          type: integer
          format: int64
          minimum: 0
    Company:
      type: object
      required:
      - id
      - name
      - organizationType
      - inn
      - registrationNumber
      - registrationDate
      - okved
      - directorName
      - contact
      - financials
      - simulation
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organizationType:
          type: string
          enum:
          - ИП
          - ООО
          description: Synthetic organization legal form.
        inn:
          type: string
          description: Synthetic demonstration tax identifier; not a registry lookup.
        registrationNumber:
          type: string
          description: Synthetic OGRN/OGRNIP, represented as a string.
        registrationDate:
          type: string
          format: date
        okved:
          type: string
        directorName:
          type: string
        contact:
          $ref: '#/components/schemas/CompanyContact'
        financials:
          $ref: '#/components/schemas/CompanyFinancials'
        simulation:
          type: boolean
          enum:
          - true
    CreditProduct:
      type: object
      required:
      - id
      - name
      - purposes
      - minAmountRub
      - maxAmountRub
      - minTermMonths
      - maxTermMonths
      - annualRatePercent
      - minBusinessAgeMonths
      - version
      - illustrative
      properties:
        id:
          type: string
          description: Stable public code; internal PostgreSQL UUID is not exposed.
          enum:
          - turnover
          - investment
        name:
          type: string
        purposes:
          type: array
          items:
            type: string
            enum:
            - stock
            - expenses
            - seasonal
            - equipment
            - upgrade
        minAmountRub:
          type: integer
          format: int64
          minimum: 1
        maxAmountRub:
          type: integer
          format: int64
          minimum: 1
        minTermMonths:
          type: integer
          format: int64
          minimum: 1
        maxTermMonths:
          type: integer
          format: int64
          minimum: 1
        annualRatePercent:
          type: number
          minimum: 0
          description: Annual percent, e.g. 22; serialized as a JSON number, not a string.
        minBusinessAgeMonths:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
        illustrative:
          type: boolean
          enum:
          - true
    CreditProductsResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditProduct'
    RecommendationInput:
      type: object
      required:
      - purpose
      - requestedAmountRub
      - termMonths
      - monthlyRevenueRub
      - monthlyExpensesRub
      properties:
        purpose:
          type: string
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          - other
          description: Other is a valid goal; currently neither product matches it.
        requestedAmountRub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        termMonths:
          type: integer
          format: int64
          minimum: 1
          maximum: 120
        monthlyRevenueRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
      additionalProperties: false
      description: All five fields are required, non-null. Amounts are integer rubles. companyId is forbidden;
        the company comes from the authenticated user.
      example:
        purpose: stock
        requestedAmountRub: 1500000
        termMonths: 12
        monthlyRevenueRub: 2400000
        monthlyExpensesRub: 1500000
    ProductMatches:
      type: object
      required:
      - purpose
      - amount
      - term
      - businessAge
      - affordability
      properties:
        purpose:
          type: boolean
        amount:
          type: boolean
        term:
          type: boolean
        businessAge:
          type: boolean
        affordability:
          type: boolean
          description: True when the term is allowed and the requested rounded monthly payment does not
            exceed the budget; independent of purpose, amount bounds and business age.
    FinancingAdjustment:
      type: object
      required:
      - amountRub
      - termMonths
      - monthlyPaymentRub
      - explanation
      properties:
        amountRub:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          format: int64
          minimum: 1
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 0
        explanation:
          type: string
    ProductRecommendation:
      type: object
      required:
      - product
      - matches
      - eligible
      - preliminaryAvailableAmountRub
      - monthlyPaymentRub
      - reasons
      - limitations
      - adjustments
      properties:
        product:
          $ref: '#/components/schemas/CreditProduct'
        matches:
          $ref: '#/components/schemas/ProductMatches'
        eligible:
          type: boolean
          description: All five matches are true for the original request. An adjustment does not make
            the original request eligible.
        preliminaryAvailableAmountRub:
          type: integer
          format: int64
          minimum: 0
          description: floor(paymentBudget / annuityCoefficient), capped at product maximum; zero if requested
            term is outside the product limits. Does not itself indicate eligibility.
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Annuity payment rounded up to the next whole ruble; null if requested term is outside
            the product limits.
        reasons:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/FinancingAdjustment'
    RecommendationResponse:
      type: object
      required:
      - companyId
      - businessAgeMonths
      - surplusRub
      - existingMonthlyPaymentsRub
      - paymentBudgetRub
      - products
      - recommendedProductId
      - disclaimer
      - simulation
      properties:
        companyId:
          type: string
          format: uuid
        businessAgeMonths:
          type: integer
          format: int64
          minimum: 0
          description: Completed UTC calendar months since registration, with end-of-month day clamping.
        surplusRub:
          type: integer
          format: int64
          description: Requested monthly revenue minus requested monthly expenses; may be negative.
        existingMonthlyPaymentsRub:
          type: integer
          format: int64
          minimum: 0
          description: Existing monthly debt payments loaded from the company in PostgreSQL.
        paymentBudgetRub:
          type: integer
          format: int64
          minimum: 0
          description: floor(max(0, 0.5 * surplusRub - existingMonthlyPaymentsRub)).
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductRecommendation'
        recommendedProductId:
          type: string
          nullable: true
          description: Eligible product with the lowest monthly payment, then lexicographic product ID;
            null when none is eligible. Suggested adjustments are not automatically selected.
        disclaimer:
          type: string
        simulation:
          type: boolean
          enum:
          - true
    ApplicationStatus:
      type: string
      enum:
      - draft
      - submitted
      - processing
      - manual_review
      - approved
      - rejected
      - counter_offer
      - signed
      - closed
      description: Stage 4 creates and edits only draft. The remaining statuses are reserved
        for later stages; technical processing errors are stored separately.
    ApplicationDraftInput:
      type: object
      additionalProperties: false
      description: All seven editable fields are optional and nullable. Empty object is
        a valid draft. Caller-supplied owner, company, status and service fields are forbidden.
      properties:
        productId:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public active product code, currently turnover or investment; internal
            product UUID is never accepted.
        purpose:
          type: string
          nullable: true
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          - other
          - null
          description: With a selected product the purpose must be listed in its purposes.
            other may be saved without a product; its description is not required for
            a draft.
        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Trimmed nonblank text, at most 300 Unicode characters, no NUL.
            null clears the description.
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
    ApplicationPatchInput:
      type: object
      additionalProperties: false
      required:
      - version
      minProperties: 2
      description: A positive current version and at least one editable field. Missing
        editable fields stay unchanged; explicit null clears. Updated combined values
        must meet the selected product constraints.
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        productId:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public active product code, currently turnover or investment; internal
            product UUID is never accepted.
        purpose:
          type: string
          nullable: true
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          - other
          - null
          description: With a selected product the purpose must be listed in its purposes.
            other may be saved without a product; its description is not required for
            a draft.
        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Trimmed nonblank text, at most 300 Unicode characters, no NUL.
            null clears the description.
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
    Application:
      type: object
      required:
      - applicationId
      - userId
      - companyId
      - productId
      - purpose
      - purposeDescription
      - requestedAmountRub
      - termMonths
      - monthlyRevenueRub
      - monthlyExpensesRub
      - productName
      - status
      - version
      - createdAt
      - updatedAt
      - submittedAt
      - availableActions
      properties:
        applicationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: Owner derived by backend from authentication.
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public selected product code, currently turnover or investment.
            An existing application can retain a subsequently inactive product; writes
            require an active product.
        purpose:
          type: string
          nullable: true
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          - other
          - null
          description: With a selected product the purpose must be listed in its purposes.
            other may be saved without a product; its description is not required for
            a draft.
        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Trimmed nonblank text, at most 300 Unicode characters, no NUL.
            null clears the description.
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        productName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic locking revision, initially 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          nullable: true
          format: date-time
          description: null for a draft; submit is not implemented.
        availableActions:
          type: array
          items:
            type: string
            enum:
            - edit
          description: '[edit] for draft; [] otherwise. submit is not exposed yet.'
    ApplicationProductSummary:
      type: object
      nullable: true
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Public product code.
        name:
          type: string
      description: Selected product code and display name, or null when no product is
        selected.
    ApplicationDetail:
      allOf:
      - $ref: '#/components/schemas/Application'
      - type: object
        required:
        - company
        - product
        properties:
          company:
            $ref: '#/components/schemas/Company'
          product:
            $ref: '#/components/schemas/ApplicationProductSummary'
    ApplicationSummary:
      type: object
      required:
      - applicationId
      - productId
      - productName
      - requestedAmountRub
      - termMonths
      - status
      - version
      - createdAt
      - updatedAt
      properties:
        applicationId:
          type: string
          format: uuid
        productId:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public selected product code; a saved application can retain an
            inactive product.
        productName:
          type: string
          nullable: true
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic locking revision, initially 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
    ApplicationEvent:
      type: object
      required:
      - eventId
      - eventType
      - sequence
      - status
      - createdAt
      - actorId
      - title
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: Stage 4 produces draft_created or draft_updated.
        sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
        actorId:
          type: string
          nullable: true
          format: uuid
        title:
          type: string
          example: Черновик создан
    ApplicationTimeline:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationEvent'
  responses:
    InvalidRequest:
      description: Invalid fields, UUID or JSON (invalid_request); unknown fields and trailing JSON values
        are rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: JSON body exceeds 64 KiB (request_too_large)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json; media type parameters are accepted (unsupported_media_type)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: PostgreSQL operation timed out or is unavailable (service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected internal error (internal_error); internal details are not returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired JWT (unauthorized).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role is not permitted or the company does not belong to the authenticated CLIENT (forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
