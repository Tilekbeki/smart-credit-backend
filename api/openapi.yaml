  /api/v1/applications/{applicationId}/submit:
    post:
      x-implementation-status: implemented
      operationId: submitApplication
      x-roles:
      - CLIENT
      summary: Submit the current client's complete draft for asynchronous preliminary checks
      description: 'CLIENT: создатель черновика с действующим правом записи в компании. No body is required; a nonempty
        body is rejected. Missing and foreign applications both return 404 application_not_found. Requires productId,
        purpose, requestedAmountRub, termMonths, monthlyRevenueRub and monthlyExpensesRub; other запрещён уже при
        создании черновика. The active product''s purpose, amount, term and minimum company age must match. BANK_STATEMENT
        требуется для любого продукта без актуального подтверждения точных сумм выручки и расходов. An investment
        loan requires a ready EQUIPMENT_INVOICE. Pending uploads never satisfy these requirements. Validation failures
        return detailed 422 errors without changing the application, events or jobs. In one PostgreSQL transaction
        the backend rechecks ownership, state and the draft revision, saves immutable financial and product snapshots,
        changes draft to submitted, sets submittedAt, appends APPLICATION_SUBMITTED and creates one durable job.
        A concurrent draft change can produce 409 version_conflict. The HTTP response does not wait for checks.
        The in-process worker changes the application to processing and durably stores synthetic company and credit-history
        results. The same worker calls the configured Python scoring service after prechecks, validates and persists
        its recommendation, then moves the job to awaiting_decision. The same worker applies Go credit policy and
        atomically persists approved, rejected or counter_offer with the final decision and applicable offer, or
        manual_review with its assessment and reasons. An unavailable scoring service uses bounded retries; technical
        failures never produce rejected. Repeated or concurrent submits of a submitted/processing application return
        202 with the same submittedAt and do not duplicate jobs or submission events. Other non-draft states return
        409 invalid_status. Poll the existing application and timeline APIs to observe progress; internal job results
        are not public.'
      security:
      - BearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: Nonzero UUID of an application owned by the authenticated client.
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Submission accepted, or its existing asynchronous state returned idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmitResponse'
              examples:
                queued:
                  value:
                    applicationId: 40000000-0000-4000-8000-000000000001
                    status: submitted
                    submittedAt: '2026-10-23T12:00:00Z'
                    nextStage: prechecks
                waitingForScoring:
                  value:
                    applicationId: 40000000-0000-4000-8000-000000000001
                    status: processing
                    submittedAt: '2026-10-23T12:00:00Z'
                    nextStage: awaiting_scoring
        '400':
          description: Malformed UUID or nonempty request body (invalid_request)
