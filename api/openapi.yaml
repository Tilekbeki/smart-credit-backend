          - seasonal
          - equipment
          - upgrade
          - null
          description: 'Допустимая цель из каталога продукта: stock/expenses/seasonal/equipment/upgrade. other запрещён.'
        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Trimmed nonblank text, at most 300 Unicode characters, no NUL. null clears the description.
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          nullable: true
          format: int64
          minimum: 0
          maximum: 1000000000000
    Application:
