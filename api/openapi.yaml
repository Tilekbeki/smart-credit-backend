      - attemptCount
      - maxAttempts
      - recoveryCount
      - canRetry
      properties:
        stage:
          type: string
          enum:
          - prechecks
          - scoring
          - decision
        attemptCount:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        recoveryCount:
          type: integer
          minimum: 0
          maximum: 3
        canRetry:
          type: boolean
      description: 'Только банковский assessment: ограниченный бюджет попыток, число восстановлений и возможность
        операторского повтора. Не содержит ошибок HTTP, URL, lease или секретов.'
  responses:
    InvalidRequest:
      description: Invalid fields, UUID or JSON (invalid_request); unknown fields and trailing JSON values are rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: JSON body exceeds 64 KiB (request_too_large)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json; media type parameters are accepted (unsupported_media_type)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: PostgreSQL operation timed out or is unavailable (service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected internal error (internal_error); internal details are not returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired JWT (unauthorized).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role is not permitted or the company does not belong to the authenticated CLIENT (forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentApplicationNotFound:
      description: Missing application, application inaccessible to this CLIENT, or draft requested by BANK_EMPLOYEE
        (application_not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentStorageUnavailable:
      description: PostgreSQL or private filesystem is unavailable, or an operation timed out (service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApplicationNotFound:
      description: 'Application absent or inaccessible: for CLIENT, owner/company mismatch; for BANK_EMPLOYEE, includes
        every draft (application_not_found).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: application_not_found
            message: Заявка не найдена.
    DecisionConflict:
      description: State forbids action (invalid_status), stale application version (version_conflict), stale/inactive/current-offer
        mismatch (offer_not_active), or Idempotency-Key reused with another body (idempotency_conflict). Conflicts
        do not partially change application/decision/offer/events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_status:
              value:
                error: invalid_status
                message: Действие недоступно в текущем статусе заявки.
            version_conflict:
              value:
                error: version_conflict
                message: Заявка была изменена. Обновите данные.
            offer_not_active:
              value:
                error: offer_not_active
                message: Предложение больше недоступно.
            idempotency_conflict:
              value:
                error: idempotency_conflict
                message: Ключ идемпотентности уже использован с другим запросом.
