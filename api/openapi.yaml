        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
