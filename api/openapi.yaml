  /api/v1/applications/{applicationId}/documents:
    parameters:
    - $ref: '#/components/parameters/DocumentApplicationId'
    post:
      x-implementation-status: implemented
      operationId: uploadApplicationDocument
      x-roles:
      - CLIENT
      summary: Upload a private document to the current client's draft
      description: >-
        CLIENT owner in the authenticated company only. Authorization and draft status
        are checked before reading the body and checked again before activation.
        Exactly one file and one documentType multipart part are required; unknown or
        duplicate parts are rejected. PDF, PNG and JPEG are detected from actual bytes,
        independently of the claimed part MIME type. The original filename must be a
        safe basename with a matching .pdf, .png, .jpg or .jpeg extension; path separators,
        traversal and control characters are rejected. File size is 1..5242880 bytes
        (5 MiB); the entire request, including fields and boundaries, is limited to
        5308416 bytes (5 MiB + 64 KiB). Multiple documents of the same type are allowed.
        Storage keys, checksums and filesystem paths are never returned. The application
        remains a draft and its optimistic version does not change. Required-document
        checks are performed separately by submit; no OCR is performed.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              - documentType
              properties:
                file:
                  type: string
                  format: binary
                  description: Synthetic PDF, PNG or JPEG, nonempty and no larger than 5 MiB
                documentType:
                  $ref: '#/components/schemas/DocumentType'
            encoding:
              file:
                contentType: application/pdf, image/png, image/jpeg
            example:
              documentType: BANK_STATEMENT
              file: '(binary contents of sample.pdf)'
      responses:
        '201':
          description: Document is durably readable and its metadata is active in PostgreSQL
          headers:
            Location:
              description: Authenticated API endpoint for downloading this document
              schema:
                type: string
                example: /api/v1/applications/40000000-0000-4000-8000-000000000001/documents/50000000-0000-4000-8000-000000000001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadata'
              example:
                documentId: 50000000-0000-4000-8000-000000000001
                applicationId: 40000000-0000-4000-8000-000000000001
                documentType: BANK_STATEMENT
                fileName: sample.pdf
                contentType: application/pdf
                sizeBytes: 500
                uploadedAt: '2026-10-23T12:00:00Z'
        '400':
          description: Invalid UUID, documentType, filename, empty file or malformed multipart (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocumentApplicationNotFound'
        '409':
          description: Application is not a draft (invalid_status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds 5 MiB or complete body exceeds 5 MiB + 64 KiB (request_too_large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: >-
            Content-Type is not multipart/form-data (unsupported_media_type), or actual
            content is unsupported or does not match the filename extension (unsupported_file_type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                wrongMediaType:
                  value:
                    error: unsupported_media_type
                    message: Используйте multipart/form-data с полями file и documentType.
                unsupportedFile:
                  value:
                    error: unsupported_file_type
                    message: Допустимы PDF, PNG и JPEG; расширение должно соответствовать содержимому.
        '503':
          $ref: '#/components/responses/DocumentStorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
