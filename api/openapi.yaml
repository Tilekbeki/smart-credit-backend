          type: string
          format: date-time
          description: Timestamp of the first successful submission; unchanged by retries.
        nextStage:
          type: string
          enum:
          - prechecks
          - awaiting_scoring
          description: Frozen coarse progress marker. prechecks means preliminary checks are queued/running; awaiting_scoring
            means prechecks are durably saved, including scoring in progress or already saved while the internal
            Decision Engine is pending. It does not prove a scoring result exists.
