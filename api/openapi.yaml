        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyId:
          type: string
          format: uuid
      description: Заявка сохраняет creator userId и companyId отдельно; чужой draft скрыт. Доступ проверяется по
