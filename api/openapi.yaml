components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by OTP verification; expires in eight hours
  parameters:
    DocumentApplicationId:
      name: applicationId
      in: path
      required: true
      description: UUID заявки. Требуется действующее членство; чужие черновики скрыты даже от коллег компании и
        банка. Сервис повторно проверяет права в PostgreSQL.
      schema:
        type: string
        format: uuid
    DecisionApplicationId:
      name: applicationId
      in: path
      required: true
      description: UUID заявки. Требуется действующее членство; чужие черновики скрыты даже от коллег компании и
        банка. Сервис повторно проверяет права в PostgreSQL.
      schema:
        type: string
        format: uuid
    BankApplicationId:
      name: applicationId
      in: path
      required: true
      description: Nonzero UUID of a successfully submitted application. A draft and an absent application both
        return 404 application_not_found for BANK_EMPLOYEE.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once per logical new POST operation. Scoped by authenticated user, operation and
        application. Canonical typed JSON is hashed; formatting and object-key ordering do not change identity.
        Same canonical body/key replays original status/body before stale-version validation; changed body returns
        409 idempotency_conflict. Retention is 24 hours. Access and ownership are rechecked before replay; state/transaction
        guards prevent duplicate actions after expiry. Manual decisions then conflict; a completed identical offer
        action requires matching durable audit and original/result version. Existing submit does not require this
        header.
      schema:
        type: string
        format: uuid
      example: 70000000-0000-4000-8000-000000000001
    BankStatus:
      name: status
      in: query
      required: false
      description: One optional bank-visible status. Omitting returns all eight submitted states; draft, unknown
        or repeated values return 400 invalid_request.
      schema:
        $ref: '#/components/schemas/BankApplicationStatus'
    BankCompanyId:
      name: companyId
      in: query
      required: false
      description: Optional nonzero company UUID. May occur at most once.
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
        default: 0
  schemas:
    Role:
      type: string
      enum:
      - CLIENT
      - BANK_EMPLOYEE
    DemoProfile:
      type: object
      required:
      - id
      - name
      - phone
      - role
      - companyName
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Иван Лавкин
        phone:
          type: string
          description: Synthetic phone number suitable for displaying in the demonstration UI
          example: '+79990000001'
        role:
          $ref: '#/components/schemas/Role'
        companyName:
          type: string
          nullable: true
          description: Название единственной доступной компании; null для банка, отсутствия членства или нескольких
            компаний. Выбор компании происходит после входа через /me/companies.
          example: ИП «Лавка у дома»
    DemoProfilesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoProfile'
    OTPRequestInput:
      type: object
      additionalProperties: false
      required:
      - profileId
      properties:
        profileId:
          type: string
          format: uuid
          description: Nonzero UUID of a seeded demonstration user
          example: 20000000-0000-4000-8000-000000000001
    OTPRequestResponse:
      type: object
      required:
      - otpRequestId
      - expiresAt
      - maskedPhone
      properties:
        otpRequestId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: UTC expiry, five minutes after challenge creation
        maskedPhone:
          type: string
          example: +7*** *** 0001
    OTPVerifyInput:
      type: object
      additionalProperties: false
      required:
      - otpRequestId
      - code
      properties:
        otpRequestId:
          type: string
          format: uuid
          description: Nonzero challenge UUID returned by requestDemoOTP
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Fixed demonstration OTP from DEMO_OTP_CODE; defaults to 1234
          example: '1234'
    OTPVerifyResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresAt
      - userId
      - role
      - companyId
      properties:
        accessToken:
          type: string
          description: Signed JWT; do not log it
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
          description: UTC token expiry, eight hours after issuance
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Null for BANK_EMPLOYEE
    CurrentUser:
      type: object
      required:
      - id
      - name
      - phone
      - role
      - companyId
      - displayName
      - legalName
      - additionalEmail
      - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          example: '+79990000001'
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: string
          format: uuid
          nullable: true
          description: 'Совместимый контекст: UUID только при единственном активном членстве, иначе null; для банка
            null. Не является правом доступа.'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        legalName:
          type: string
        additionalEmail:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Stable machine-readable error code; role middleware returns forbidden with HTTP 403
        message:
          type: string
          description: Safe human-readable explanation without database or credential details
      example:
        error: invalid_request
        message: Некорректный запрос
    CompanyContact:
      type: object
      required:
      - phone
      - email
      - address
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
      additionalProperties: false
    CompanyFinancials:
      type: object
      required:
      - monthlyRevenueRub
