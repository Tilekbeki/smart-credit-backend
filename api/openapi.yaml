        requestedAmountRub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        termMonths:
          type: integer
          format: int64
          minimum: 1
          maximum: 120
        monthlyRevenueRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
      additionalProperties: false
      description: All five fields are required, non-null. Amounts are integer rubles. companyId is forbidden;
