            comment.
        customerExplanation:
          type: string
          maxLength: 1000
          description: Публичное объяснение клиенту; пробелы по краям удаляются. Отсутствие или пустой текст включает
            стандартную содержательную причину.
      description: Both amountRub and termMonths must equal the original submitted request.
      oneOf:
      - required:
        - comment
        not:
          required:
          - internalComment
      - required:
        - internalComment
        not:
          required:
          - comment
    CounterOfferDecisionInput:
      type: object
      additionalProperties: false
