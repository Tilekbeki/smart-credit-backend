        version:
          type: integer
          format: int64
          minimum: 1
        decision:
          type: string
          enum:
          - counter_offer
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'Required bank-internal comment: 1..1000 Unicode characters after trimming outer whitespace.
            Never copied automatically to client-facing reasons.'
        offer:
          $ref: '#/components/schemas/ManualOfferInput'
        internalComment:
          type: string
          minLength: 1
          maxLength: 1000
          description: Банковский внутренний комментарий. Передайте ровно одно из internalComment и совместимого
            comment.
        customerExplanation:
          type: string
          maxLength: 1000
          description: Публичное объяснение клиенту; пробелы по краям удаляются. Отсутствие или пустой текст включает
            стандартную содержательную причину.
      description: Amount must not exceed the original requested amount; amount and term must satisfy frozen product
