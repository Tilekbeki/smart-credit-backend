      summary: Upload a private document to the current client's draft
      description: 'CLIENT: создатель черновика с действующим правом записи в компании. Authorization and draft
        status are checked before reading the body and checked again before activation. Exactly one file and one
        documentType multipart part are required; unknown or duplicate parts are rejected. PDF, PNG and JPEG are
        detected from actual bytes, independently of the claimed part MIME type. The original filename must be a
