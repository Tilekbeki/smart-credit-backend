          type: boolean
        amount:
          type: boolean
        term:
          type: boolean
        businessAge:
          type: boolean
        affordability:
          type: boolean
          description: True when the term is allowed and the requested rounded monthly payment does not
            exceed the budget; independent of purpose, amount bounds and business age.
    FinancingAdjustment:
      type: object
      required:
      - amountRub
      - termMonths
      - monthlyPaymentRub
      - explanation
      properties:
        amountRub:
          type: integer
