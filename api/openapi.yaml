openapi: 3.0.3
info:
  title: Smart Credit Go backend
  version: 1.0.0
  description: 'Demonstration authentication, own-company data, synthetic credit products and preliminary
    financing selection for a hackathon. DEMO_OTP_CODE defaults to 1234; no SMS is sent. Public profile
    selection includes a bank employee and must not be used for production access. Product conditions
    and company data are synthetic and are not actual Alfa-Bank offers. Recommendations neither create
    applications nor constitute or guarantee credit decisions; the recommendations endpoint does not
    call Python scoring. All responses
    use Cache-Control: no-store. CLIENT users can persist partial credit drafts and inspect their history;
    a separate submit operation validates and atomically queues preliminary checks. A durable worker in
    the same process performs synthetic company and credit-history checks, calls a separately configured
    Python scoring HTTP service and durably saves its validated recommendation. The same worker claims
    awaiting_decision jobs and applies Go credit policy, producing approved, rejected, counter_offer or
    manual_review. Final automatic decisions and applicable offers are persisted atomically; manual_review
    stores the assessment without a fictitious final decision. Private application documents can be uploaded by their CLIENT owner and read by their owner
    or BANK_EMPLOYEE after successful submit. Drafts are private to their CLIENT owner.
    API v1 freezes 19 implemented and seven planned operations; planned operations are marked
    x-implementation-status: planned and have no handlers. Decision Engine is implemented internally;
    decision details and offers are not yet exposed through these planned endpoints.
    Scoring integration follows the local JSON Schema; the real Python service and its Docker artifact
    are not supplied by this repository and have not been verified. Monetary amounts use integer rubles,
    annualRatePercent uses percent, and
    timestamps use RFC 3339 UTC. Clients may keep unlimited independent drafts, including several
    drafts of the same product; submitting one does not alter the others.'
x-application-lifecycle:
  transitions:
  - from: draft
    to: submitted
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/submit
    implementation: implemented
  - from: submitted
    to: processing
    actor: WORKER
    implementation: implemented
  - from: processing
    to:
    - approved
    - counter_offer
    - rejected
    - manual_review
    actor: GO_CREDIT_POLICY
    implementation: implemented
  - from: manual_review
    to:
    - approved
    - counter_offer
    - rejected
    actor: BANK_EMPLOYEE
    via: POST /api/v1/bank/applications/{applicationId}/decisions
    implementation: planned
  - from:
    - approved
    - counter_offer
    to: signed
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/accept
    implementation: planned
  - from:
    - approved
    - counter_offer
    to: closed
    actor: CLIENT
    via: POST /api/v1/applications/{applicationId}/decline
    implementation: planned
  terminalStates:
  - rejected
  - signed
  - closed
  technicalFailure: Retain submitted/processing. The planned decision API will expose a safe Processing
    state; current application reads do not expose job errors. awaiting_scoring and awaiting_decision
    are internal job states, never application statuses.
  signedMeaning: MVP demonstration confirmation only; no loan disbursement or legally binding bank agreement.
x-known-issues:
- code: application_available_actions_incomplete
  description: Implemented Application.availableActions is [edit] for draft and [] otherwise. submit is
    implemented but omitted from this list; expansion is a separate agreed task.
x-bank-draft-policy:
  visibilityStartsAt: successful submit
  draftListResult: never included; status=draft returns 400 invalid_request
  draftReadResult: 404 application_not_found for all bank reads, including existing document list/download
  draftCountLimit: none for CLIENT; several independent drafts per product allowed
servers:
- url: http://localhost:8080
paths:
  /health:
    get:
      x-implementation-status: implemented
      operationId: health
      x-roles: []
      summary: Process liveness; does not query PostgreSQL
      responses:
        '200':
          description: The HTTP process is running
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  service:
                    type: string
                    enum:
                    - backend
  /ready:
    get:
      x-implementation-status: implemented
      operationId: readiness
      x-roles: []
      summary: Checks PostgreSQL connectivity within DB_PING_TIMEOUT
      responses:
        '200':
          description: PostgreSQL is reachable; does not verify migration version
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: PostgreSQL is unavailable or the check timed out
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - error
                properties:
                  status:
                    type: string
                    enum:
                    - not_ready
                  error:
                    type: string
                    enum:
                    - database_unavailable
  /api/v1/demo/profiles:
    get:
      x-implementation-status: implemented
      operationId: listDemoProfiles
      x-roles: []
      summary: List the four seeded synthetic users from PostgreSQL
      description: Three CLIENT profiles and one BANK_EMPLOYEE profile. Authentication is not required.
      responses:
        '200':
          description: Available demonstration profiles; phone numbers are synthetic and displayable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoProfilesResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/request:
    post:
      x-implementation-status: implemented
      operationId: requestDemoOTP
      x-roles: []
      summary: Create an OTP challenge and simulate sending an SMS
      description: 'Uses the selected user''s stored phone number. The challenge expires after five

        minutes and allows at most five verification attempts. Creating a new challenge

        invalidates that user''s previous active challenges atomically. The code is never

        returned or logged; no real SMS is sent.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestInput'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The selected profile does not exist (profile_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/otp/verify:
    post:
      x-implementation-status: implemented
      operationId: verifyDemoOTP
      x-roles: []
      summary: Consume a valid OTP and issue an eight-hour access token
      description: 'Code comparison, attempt limits and single use are enforced atomically in

        PostgreSQL. A valid code on the fifth attempt succeeds; after five incorrect

        attempts the challenge is blocked. A consumed, expired, superseded or blocked

        challenge cannot issue a token. Role and company come from the stored user.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyInput'
      responses:
        '200':
          description: OTP consumed and JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyResponse'
        '400':
          description: Malformed input (invalid_request) or an incorrect code (invalid_otp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Challenge does not exist (otp_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Challenge was already consumed (otp_used) or superseded (otp_invalidated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Challenge has expired (otp_expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Five failed verification attempts exhausted the challenge (otp_attempts_exceeded);
            request a new OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      x-implementation-status: implemented
      operationId: getCurrentUser
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: Return the authenticated user from PostgreSQL
      description: 'Requires an HS256 JWT with a valid signature, expiration, issuer and audience.

        Its subject identifies the user; role and company are loaded from PostgreSQL

        on each authenticated request instead of trusting client input or JWT role claims.

        '
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Missing, malformed, invalid or expired token, or unknown user (unauthorized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/companies/{companyId}:
    get:
      x-implementation-status: implemented
      operationId: getOwnCompany
      x-roles:
      - CLIENT
      summary: Get the authenticated client’s own company
      description: CLIENT only. Company ownership is checked before reading details. BANK_EMPLOYEE and
        access to another company return 403; no foreign company existence is disclosed. All legal and
        contact details are synthetic.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Own company was not found (company_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Nonzero UUID matching the authenticated user’s companyId.
  /api/v1/credit-products:
    get:
      x-implementation-status: implemented
      operationId: listCreditProducts
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: List active synthetic credit products
      description: CLIENT and BANK_EMPLOYEE. Products and conditions are read from PostgreSQL. No product
        is created by this request.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProductsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/credit-products/{productId}:
    get:
      x-implementation-status: implemented
      operationId: getCreditProduct
      x-roles:
      - CLIENT
      - BANK_EMPLOYEE
      summary: Get an active product by public code
      description: CLIENT and BANK_EMPLOYEE. The path uses turnover/investment codes, not UUIDs. Conditions
        are synthetic, not actual bank offers.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          description: Unknown or inactive product (product_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
        example: turnover
  /api/v1/recommendations:
    post:
      x-implementation-status: implemented
      operationId: recommendFinancing
      x-roles:
      - CLIENT
      summary: Calculate an explainable preliminary financing selection
      description: CLIENT only. The company and existing monthly debt payments come from PostgreSQL. Request
        revenue/expenses override the company figures for this calculation only and are not persisted.
        Uses exact rational arithmetic; monthly payments are rounded up, budgets and available amounts
        down to whole rubles. A valid request without eligible products returns 200 with recommendedProductId=null
        and explanations. Suggested amount/term corrections must be explicitly resubmitted to become the
        selected request. This endpoint does not call Python scoring, create a credit decision, application
        or background job, or modify any status.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
  /api/v1/applications:
    post:
      x-implementation-status: implemented
      operationId: createApplicationDraft
      x-roles:
      - CLIENT
      summary: Create a partial client-owned credit draft
      description: CLIENT only. Owner and company come from the current PostgreSQL user;
        they must not be supplied in JSON. An empty object or nullable editable fields
        are accepted. Provided values must be valid; when productId is selected, any
        present purpose, amount and term must satisfy that active product. Creation
        and draft_created event are committed atomically. No scoring, decision or background
        job is created. Multiple independent drafts, including drafts of the same product,
        are allowed without an MVP count limit. Submitting one never submits or deletes the others.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDraftInput'
            examples:
              empty:
                summary: Save an empty draft
                value: {}
              partial:
                summary: Persist selected product and parameters
                value:
                  productId: turnover
                  purpose: stock
                  requestedAmountRub: 1500000
                  termMonths: 12
      responses:
        '201':
          description: Draft and first timeline event created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
              example:
                applicationId: 40000000-0000-4000-8000-000000000001
                userId: 20000000-0000-4000-8000-000000000001
                companyId: 10000000-0000-4000-8000-000000000001
                productId: turnover
                purpose: stock
                purposeDescription: null
                requestedAmountRub: 1500000
                termMonths: 12
                monthlyRevenueRub: 2400000
                monthlyExpensesRub: 1500000
                productName: Оборотный кредит
                status: draft
                version: 1
                createdAt: '2026-10-23T12:00:00Z'
                updatedAt: '2026-10-23T12:00:00Z'
                submittedAt: null
                availableActions:
                - edit
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Unknown or inactive product (product_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      x-implementation-status: implemented
      operationId: listOwnApplications
      x-roles:
      - CLIENT
      summary: List applications owned by the current client in their company
      description: CLIENT only. SQL pagination and status filtering apply to both owner
        and company scope; other owners are never included. Ordered by createdAt descending,
        then applicationId descending. total counts all matching rows before pagination.
        Unknown/repeated query parameters and malformed limits, offsets or statuses
        are rejected. Creating a draft does not submit it; the separate submit operation
        advances complete applications to submitted and asynchronous processing.
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Matching applications and pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}:
    parameters:
    - name: applicationId
      in: path
      required: true
      description: Nonzero application UUID. Ownership is checked using both authenticated
        user ID and company ID.
      schema:
        type: string
        format: uuid
    get:
      x-implementation-status: implemented
      operationId: getOwnApplication
      x-roles:
      - CLIENT
      summary: Open the current client’s saved application
      description: CLIENT only, owner and company must match the current user. Missing
        and foreign UUIDs both return 404 application_not_found without disclosing existence.
        Includes permitted company details and the selected product summary. Draft availableActions
        is [edit]; other states have no editing actions. Submit is a separate API operation.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Saved application with company and product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      x-implementation-status: implemented
      operationId: patchApplicationDraft
      x-roles:
      - CLIENT
      summary: Edit a draft using optimistic locking
      description: CLIENT owner only. Positive non-null version and at least one editable
        field are required. An absent field is unchanged; an explicit null clears that
        editable field. Immutable/unknown fields are rejected. Validation uses the merged
        draft and the selected active product. A successful PATCH, including assignment
        of an existing value, increments version exactly once and appends draft_updated
        in the same transaction. Stale/concurrent versions return 409 version_conflict;
        a non-draft application returns 409 invalid_status. Neither error changes the
        draft or timeline.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatchInput'
            example:
              version: 1
              requestedAmountRub: 1800000
              purposeDescription: null
      responses:
        '200':
          description: Updated draft with incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Unknown/inactive product (product_not_found); for an application
            path, a missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: Stale version (version_conflict) or an application whose status
            is not draft (invalid_status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}/submit:
    post:
      x-implementation-status: implemented
      operationId: submitApplication
      x-roles:
      - CLIENT
      summary: Submit the current client's complete draft for asynchronous preliminary checks
      description: >-
        CLIENT owner in the authenticated company only. No body is required; a nonempty
        body is rejected. Missing and foreign applications both return 404
        application_not_found. Requires productId, purpose, requestedAmountRub, termMonths,
        monthlyRevenueRub and monthlyExpensesRub; purposeDescription is also required for
        other. The active product's purpose, amount, term and minimum company age must
        match. A turnover loan requires a ready BANK_STATEMENT unless the company's
        private server-controlled profile has a trusted financial source. An investment
        loan requires a ready EQUIPMENT_INVOICE. Pending uploads never satisfy these
        requirements. Validation failures return detailed 422 errors without changing
        the application, events or jobs.
        In one PostgreSQL transaction the backend rechecks ownership, state and the
        draft revision, saves immutable financial and product snapshots, changes draft
        to submitted, sets submittedAt, appends APPLICATION_SUBMITTED and creates one
        durable job. A concurrent draft change can produce 409 version_conflict.
        The HTTP response does not wait for checks. The in-process worker changes the
        application to processing and durably stores synthetic company and credit-history
        results. The same worker calls the configured Python scoring service after prechecks, validates and
        persists its recommendation, then moves the job to awaiting_decision. The same worker applies Go
        credit policy and atomically persists approved, rejected or counter_offer with the final decision
        and applicable offer, or manual_review with its assessment and reasons. An unavailable scoring service uses bounded retries;
        technical failures never produce rejected.
        Repeated or concurrent submits of a submitted/processing application return 202
        with the same submittedAt and do not duplicate jobs or submission events.
        Other non-draft states return 409 invalid_status. Poll the existing application
        and timeline APIs to observe progress; internal job results are not public.
      security:
      - BearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: Nonzero UUID of an application owned by the authenticated client.
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Submission accepted, or its existing asynchronous state returned idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmitResponse'
              examples:
                queued:
                  value:
                    applicationId: 40000000-0000-4000-8000-000000000001
                    status: submitted
                    submittedAt: '2026-10-23T12:00:00Z'
                    nextStage: prechecks
                waitingForScoring:
                  value:
                    applicationId: 40000000-0000-4000-8000-000000000001
                    status: processing
                    submittedAt: '2026-10-23T12:00:00Z'
                    nextStage: awaiting_scoring
        '400':
          description: Malformed UUID or nonempty request body (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Missing or foreign application (application_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Incompatible application state (invalid_status) or concurrent draft update (version_conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Missing fields/documents or unmet active product requirements (validation_failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSubmitValidationError'
              example:
                error: validation_failed
                message: Проверьте обязательные поля и документы заявки.
                details:
                - field: documents.EQUIPMENT_INVOICE
                  code: required_document_missing
                  message: Загрузите счёт или договор на оборудование.
        '503':
          $ref: '#/components/responses/DocumentStorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/applications/{applicationId}/timeline:
    get:
      x-implementation-status: implemented
      operationId: getApplicationTimeline
      x-roles:
      - CLIENT
      summary: Read the ordered history of the current client’s application
      description: CLIENT owner only. Missing and foreign applications both return 404
        application_not_found. Events are ordered by increasing sequence. Draft writes
        record draft_created and draft_updated. Submission records APPLICATION_SUBMITTED
        with the client actorId; processing records PROCESSING_STARTED,
        COMPANY_CHECK_COMPLETED, CREDIT_HISTORY_CHECK_COMPLETED and PRECHECKS_COMPLETED
        with null actorId for system actions. Scoring adds SCORING_STARTED and, only after its result
        is durably saved, SCORING_COMPLETED. These events have null actorId and processing status.
        Go policy then records DECISION_PROCESSING_STARTED with processing status, followed by exactly one
        of APPLICATION_APPROVED (approved), APPLICATION_REJECTED (rejected), COUNTER_OFFER_CREATED
        (counter_offer) or MANUAL_REVIEW_REQUIRED (manual_review), all with null actorId.
        Retries do not duplicate durable events. Timeline never contains OTP, JWT,
        internal errors, score, factors or editable financial values.
      security:
      - BearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        description: Nonzero application UUID. Ownership is checked using both authenticated
          user ID and company ID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ordered application events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTimeline'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Missing or foreign application (application_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
