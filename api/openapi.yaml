          type: string
          enum:
          - submitted
          - processing
        submittedAt:
          type: string
          format: date-time
          description: Timestamp of the first successful submission; unchanged by retries.
        nextStage:
          type: string
          enum:
          - prechecks
          - awaiting_scoring
          description: Frozen coarse progress marker. prechecks means preliminary checks are queued/running;
            awaiting_scoring means prechecks are durably saved, including scoring in progress or
            already saved while the internal Decision Engine is pending. It does not prove a scoring result exists.
    ApplicationSubmitValidationError:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - details
      properties:
        error:
          type: string
          enum:
          - validation_failed
        message:
          type: string
          example: Проверьте обязательные поля и документы заявки.
        details:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
                description: Editable application field, company.registrationDate, or documents.BANK_STATEMENT/documents.EQUIPMENT_INVOICE.
              code:
                type: string
                enum:
                - required
                - out_of_range
                - unsupported_purpose
                - product_unavailable
                - business_too_young
                - required_document_missing
                - invalid_value
              message:
                type: string
    ApplicationProductSummary:
      type: object
      nullable: true
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Public product code.
        name:
          type: string
      description: Selected product code and display name, or null when no product is
        selected.
    ApplicationDetail:
      allOf:
      - $ref: '#/components/schemas/Application'
      - type: object
        required:
        - company
        - product
        properties:
          company:
            $ref: '#/components/schemas/Company'
          product:
            $ref: '#/components/schemas/ApplicationProductSummary'
    ApplicationSummary:
      type: object
      required:
      - applicationId
      - productId
      - productName
      - requestedAmountRub
      - termMonths
      - status
      - version
      - createdAt
      - updatedAt
      properties:
        applicationId:
          type: string
          format: uuid
        productId:
          type: string
          nullable: true
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public selected product code; a saved application can retain an
            inactive product.
        productName:
          type: string
          nullable: true
        requestedAmountRub:
          type: integer
          nullable: true
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          nullable: true
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic locking revision, initially 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
    ApplicationEvent:
      type: object
      required:
      - eventId
      - eventType
      - sequence
      - status
      - createdAt
      - actorId
      - title
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          description: >-
            draft_created, draft_updated, APPLICATION_SUBMITTED, PROCESSING_STARTED,
            COMPANY_CHECK_COMPLETED, CREDIT_HISTORY_CHECK_COMPLETED, PRECHECKS_COMPLETED,
            SCORING_STARTED, SCORING_COMPLETED, DECISION_PROCESSING_STARTED, APPLICATION_APPROVED,
            APPLICATION_REJECTED, COUNTER_OFFER_CREATED or MANUAL_REVIEW_REQUIRED. System events
            contain no financial results, score or private decision details.
        sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        createdAt:
          type: string
          format: date-time
        actorId:
          type: string
          nullable: true
          format: uuid
          description: Acting user for draft/submission events; null for system processing events.
        title:
          type: string
          example: Черновик создан
    ApplicationTimeline:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationEvent'
    DocumentType:
      type: string
      description: >-
        BANK_STATEMENT is required on turnover submit without a trusted server-controlled
        financial source; EQUIPMENT_INVOICE is required on investment submit. Draft
        upload permits either type without checking completeness; only ready documents
        satisfy submit validation.
      enum:
      - BANK_STATEMENT
      - EQUIPMENT_INVOICE
    DocumentMetadata:
      type: object
      additionalProperties: false
      required:
      - documentId
      - applicationId
      - documentType
      - fileName
      - contentType
      - sizeBytes
      - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        fileName:
          type: string
          description: Validated original basename; not the internal storage filename
          example: sample.pdf
        contentType:
          type: string
          enum:
          - application/pdf
          - image/png
          - image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        uploadedAt:
          type: string
          format: date-time
    DocumentList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentMetadata'
    BankApplicationStatus:
      type: string
      enum:
      - submitted
      - processing
      - manual_review
      - approved
      - counter_offer
      - rejected
      - signed
      - closed
      description: Only submitted applications are visible to BANK_EMPLOYEE. draft is never a bank-visible
        state.
    RiskLevel:
      type: string
      nullable: true
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - null
      description: Demo risk category assigned by Go backend policy. Higher score means lower risk;
        LOW for score >= 80, MEDIUM for 50 <= score < 80, HIGH for score < 50. null means not available.
    CreditOutcome:
      type: string
      nullable: true
      enum:
      - approved
      - counter_offer
      - rejected
      - null
      description: Final credit decision made by Go backend; scoring recommendations are not final decisions.
        null before a final decision, including manual_review.
    CreditOffer:
      type: object
      additionalProperties: false
      required:
      - offerId
      - applicationId
      - productId
      - amountRub
      - termMonths
      - annualRatePercent
      - monthlyPaymentRub
      - expiresAt
      - status
      properties:
        offerId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        productId:
          type: string
          enum:
          - turnover
          - investment
          description: Public product code; not the internal product UUID.
        amountRub:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
        annualRatePercent:
          type: number
          minimum: 0
          description: 'Fixed annual rate in percent: 22 means 22%, not 0.22. The frozen product rate is used.'
        monthlyPaymentRub:
          type: integer
          format: int64
          minimum: 1
          description: Integer rubles, calculated by backend using the frozen product conditions.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Always null in MVP; offer expiry and expiry processing are not implemented.
        status:
          type: string
          enum:
          - active
          - accepted
          - withdrawn
      description: One current primary offer. Null when no offer exists; rejected decisions have no offer.
        All monetary amounts are integer rubles.
      nullable: true
    Processing:
      type: object
      additionalProperties: false
      required:
      - stage
      - state
      - retryAt
      - message
      properties:
        stage:
          type: string
          enum:
          - prechecks
          - scoring
          - decision
        state:
          type: string
          enum:
          - waiting
          - running
          - retrying
          - failed
        retryAt:
          type: string
          format: date-time
          nullable: true
          description: Scheduled automatic retry, or null.
        message:
          type: string
          nullable: true
          description: Safe user-facing message. Never contains raw errors, SQL, addresses, lease data or
            scoring payloads.
      description: Normalized background-processing state. Null for drafts, final states and manual_review.
        A technical failure never implies a rejected credit decision.
      nullable: true
    CreditDecision:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - status
      - version
      - decision
      - score
      - riskLevel
      - reasons
      - assessedAt
      - reviewedBy
      - offer
      - processing
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Application revision used for optimistic locking; not a decision, product or offer
            version.
        decision:
          $ref: '#/components/schemas/CreditOutcome'
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Python scoring integer scale 0..100; higher score means lower risk in the demo policy.
            LOW >= 80, MEDIUM 50..79, HIGH < 50. null means not available, not zero.
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        reasons:
          type: array
          items:
            type: string
          description: Safe client-facing reasons generated by backend. Private employee comments are not
            exposed here.
        assessedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of final credit decision creation; null until a final decision exists.
        reviewedBy:
          type: string
          format: uuid
          nullable: true
          description: Acting employee UUID for a manual final decision, otherwise null.
        offer:
          $ref: '#/components/schemas/CreditOffer'
        processing:
          $ref: '#/components/schemas/Processing'
      description: Decision view for every client-owned application state. manual_review has decision=null
        and processing=null; score and riskLevel may be present. signed/closed preserve the last credit decision.
        Declining a proposal does not turn the bank decision into rejected. Score examples are synthetic and
        do not define risk thresholds.
    OfferActionInput:
      type: object
      additionalProperties: false
      required:
      - version
      - offerId
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: Current application revision. A repeat of the same completed offer action succeeds
            without another mutation.
        offerId:
          type: string
          format: uuid
      description: The current active primary offer of the current decision. Only CLIENT owner in the same
        company may act.
    ManualOfferInput:
      type: object
      additionalProperties: false
      required:
      - amountRub
      - termMonths
      properties:
        amountRub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
      description: Product and fixed rate come from the submitted snapshot. Amount and term must be within
        its product limits; monthly payment is calculated by backend.
    ApprovedDecisionInput:
      type: object
      additionalProperties: false
      required:
      - version
      - decision
      - comment
      - offer
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        decision:
          type: string
          enum:
          - approved
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'Required bank-internal comment: 1..1000 Unicode characters after trimming outer whitespace.
            Never copied automatically to client-facing reasons.'
        offer:
          $ref: '#/components/schemas/ManualOfferInput'
      description: Both amountRub and termMonths must equal the original submitted request.
    CounterOfferDecisionInput:
      type: object
      additionalProperties: false
      required:
      - version
      - decision
      - comment
      - offer
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        decision:
          type: string
          enum:
          - counter_offer
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'Required bank-internal comment: 1..1000 Unicode characters after trimming outer whitespace.
            Never copied automatically to client-facing reasons.'
        offer:
          $ref: '#/components/schemas/ManualOfferInput'
      description: Amount must not exceed the original requested amount; amount and term must satisfy frozen
        product limits; at least one must differ. Rate stays fixed.
    RejectedDecisionInput:
      type: object
      additionalProperties: false
      required:
      - version
      - decision
      - comment
      - offer
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        decision:
          type: string
          enum:
          - rejected
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'Required bank-internal comment: 1..1000 Unicode characters after trimming outer whitespace.
            Never copied automatically to client-facing reasons.'
        offer:
          type: object
          nullable: true
          enum:
          - null
      description: 'No proposal is allowed: offer must be null.'
    ManualDecisionInput:
      type: object
      oneOf:
      - $ref: '#/components/schemas/ApprovedDecisionInput'
      - $ref: '#/components/schemas/CounterOfferDecisionInput'
      - $ref: '#/components/schemas/RejectedDecisionInput'
      discriminator:
        propertyName: decision
        mapping:
          approved: '#/components/schemas/ApprovedDecisionInput'
          counter_offer: '#/components/schemas/CounterOfferDecisionInput'
          rejected: '#/components/schemas/RejectedDecisionInput'
      description: BANK_EMPLOYEE only, application must be manual_review. Employee identity is read from authentication;
        reviewer, score, risk, rate and calculated payment input fields are forbidden.
    BankCompanySummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - inn
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inn:
          type: string
      description: Submitted company identity from its frozen snapshot.
    BankProductSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Public product code from the submitted snapshot.
        name:
          type: string
      description: Non-null product identity of a successfully submitted application.
    BankApplication:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - company
      - product
      - requestedAmountRub
      - termMonths
      - status
      - version
      - createdAt
      - updatedAt
      - submittedAt
      - manualReviewRequired
      - availableActions
      properties:
        applicationId:
          type: string
          format: uuid
        company:
          $ref: '#/components/schemas/BankCompanySummary'
        product:
          $ref: '#/components/schemas/BankProductSummary'
        requestedAmountRub:
          type: integer
          format: int64
          minimum: 1
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
        status:
          $ref: '#/components/schemas/BankApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        manualReviewRequired:
          type: boolean
          description: True exactly when status is manual_review.
        availableActions:
          type: array
          items:
            type: string
            enum:
            - decide
          description: '[decide] only in manual_review; [] otherwise. No draft editing, upload or submit actions
            for employees.'
      description: Bank list item; drafts are never returned.
    BankApplicationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BankApplication'
        total:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 2147483647
      description: Filtered total before pagination. Ordered by createdAt DESC, applicationId DESC. With no
        status filter all eight bank-visible statuses are included, never draft.
    BankApplicationDetail:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - userId
      - companyId
      - productId
      - purpose
      - purposeDescription
      - requestedAmountRub
      - termMonths
      - monthlyRevenueRub
      - monthlyExpensesRub
      - productName
      - status
      - version
      - createdAt
      - updatedAt
      - submittedAt
      - availableActions
      - company
      - product
      - productTerms
      - manualReviewRequired
      properties:
        applicationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: Owner derived by backend from authentication.
        companyId:
          type: string
          format: uuid
        productId:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          description: Public selected product code, currently turnover or investment. An existing application
            can retain a subsequently inactive product; writes require an active product.
        purpose:
          type: string
          enum:
          - stock
          - expenses
          - seasonal
          - equipment
          - upgrade
          - other
          description: Submitted purpose validated against the product snapshot. other requires a nonblank
            purposeDescription at submit.
        purposeDescription:
          type: string
          nullable: true
          maxLength: 300
          description: Submitted explanation, at most 300 Unicode characters, no NUL. Null when no explanation
            was supplied for a purpose other than other.
        requestedAmountRub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Integer rubles; selected product limits also apply.
        termMonths:
          type: integer
          minimum: 1
          maximum: 120
          description: Selected product limits also apply.
        monthlyRevenueRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        monthlyExpensesRub:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
        productName:
          type: string
        status:
          $ref: '#/components/schemas/BankApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Optimistic locking revision, initially 1.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          description: Set by successful submit; bank visibility starts only after submission.
        availableActions:
          type: array
          items:
            type: string
            enum:
            - decide
          description: '[decide] only in manual_review; [] otherwise. No draft editing, upload or submit actions
            for employees.'
        company:
          $ref: '#/components/schemas/Company'
        product:
          $ref: '#/components/schemas/BankProductSummary'
        productTerms:
          $ref: '#/components/schemas/CreditProduct'
        manualReviewRequired:
          type: boolean
          description: True exactly when status is manual_review.
      description: Submitted application only; draft returns 404 application_not_found. Company and productTerms
        are the snapshots frozen by submit, not current mutable company/product data. Documents use the existing
        list/download operations. Bank availableActions is independent of the existing client Application.availableActions.
    AssessmentProblem:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
      description: Stable machine code and safe display message.
    CompanyCheck:
      type: object
      additionalProperties: false
      required:
      - status
      - checks
      - problems
      - checkedAt
      - durationMs
      - simulation
      properties:
        status:
          type: string
          enum:
          - passed
          - failed
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - passed
            properties:
              code:
                type: string
              passed:
                type: boolean
        problems:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentProblem'
        checkedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          minimum: 0
        simulation:
          type: boolean
          enum:
          - true
      description: Existing pipeline company-check shape. Null until the result is durably available.
      nullable: true
    CreditHistory:
      type: object
      additionalProperties: false
      required:
      - existingDebtRub
      - existingMonthlyPaymentsRub
      - overdueCount
      - checkedAt
      - simulation
      properties:
        existingDebtRub:
          type: integer
          format: int64
          minimum: 0
        existingMonthlyPaymentsRub:
          type: integer
          format: int64
          minimum: 0
        overdueCount:
          type: integer
          format: int64
          minimum: 0
        checkedAt:
          type: string
          format: date-time
        simulation:
          type: boolean
          enum:
          - true
      description: Existing synthetic credit-history shape. Null until available.
      nullable: true
    ScoringAssessment:
      type: object
      additionalProperties: false
      required:
      - score
      - assessedAt
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        assessedAt:
          type: string
          format: date-time
      description: Normalized existing scoring result, not a final credit decision. Demo policy treats higher
        score as lower risk; LOW >= 80, MEDIUM 50..79, HIGH < 50.
      nullable: true
    AssessmentRecommendation:
      type: object
      additionalProperties: false
      required:
      - decision
      - reasons
      - offer
      properties:
        decision:
          type: string
          enum:
          - approved
          - counter_offer
          - rejected
        reasons:
          type: array
          items:
            type: string
        offer:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - amountRub
          - termMonths
          properties:
            amountRub:
              type: integer
              format: int64
              minimum: 1
            termMonths:
              type: integer
              minimum: 1
              maximum: 120
      description: 'Advisory Go-policy recommendation. Not an active CreditOffer: no offerId. For rejected,
        offer=null.'
    ManualDecisionAudit:
      type: object
      additionalProperties: false
      required:
      - decision
      - comment
      - reviewedBy
      - reviewedAt
      properties:
        decision:
          type: string
          enum:
          - approved
          - counter_offer
          - rejected
        comment:
          type: string
          minLength: 1
          maxLength: 1000
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
      description: Bank-only audit of a manual final decision. Null before a manual decision.
      nullable: true
    BankAssessment:
      type: object
      additionalProperties: false
      required:
      - applicationId
      - status
      - version
      - companyCheck
      - creditHistory
      - scoring
      - riskLevel
      - manualReviewReasons
      - recommendations
      - manualDecision
      - processing
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BankApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        companyCheck:
          $ref: '#/components/schemas/CompanyCheck'
        creditHistory:
          $ref: '#/components/schemas/CreditHistory'
        scoring:
          $ref: '#/components/schemas/ScoringAssessment'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        manualReviewReasons:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentProblem'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentRecommendation'
        manualDecision:
          $ref: '#/components/schemas/ManualDecisionAudit'
        processing:
          $ref: '#/components/schemas/Processing'
      description: Bank-only normalized assessment of a submitted application. Draft returns 404. Missing
        results are null; missing reason/recommendation lists are []. Risk policy is authoritative in Go;
        Python scoring provides recommendations. No raw service response or private infrastructure details
        are exposed.
    DecisionValidationError:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - details
      properties:
        error:
          type: string
          enum:
          - validation_failed
        message:
          type: string
        details:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
                description: comment, offer.amountRub or offer.termMonths.
              code:
                type: string
                enum:
                - required
                - out_of_range
                - invalid_value
                - unchanged_offer
              message:
                type: string
      description: Business validation failures; the application, decision, offer, timeline and idempotency
        result are not partially committed.
  responses:
    InvalidRequest:
      description: Invalid fields, UUID or JSON (invalid_request); unknown fields and trailing JSON values
        are rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTooLarge:
      description: JSON body exceeds 64 KiB (request_too_large)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json; media type parameters are accepted (unsupported_media_type)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: PostgreSQL operation timed out or is unavailable (service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected internal error (internal_error); internal details are not returned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired JWT (unauthorized).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role is not permitted or the company does not belong to the authenticated CLIENT (forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentApplicationNotFound:
      description: Missing application, application inaccessible to this CLIENT, or draft requested by BANK_EMPLOYEE (application_not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentStorageUnavailable:
      description: PostgreSQL or private filesystem is unavailable, or an operation timed out (service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApplicationNotFound:
      description: 'Application absent or inaccessible: for CLIENT, owner/company mismatch; for BANK_EMPLOYEE,
        includes every draft (application_not_found).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: application_not_found
            message: Заявка не найдена.
    DecisionConflict:
      description: State forbids action (invalid_status), stale application version (version_conflict), stale/inactive/current-offer
        mismatch (offer_not_active), or Idempotency-Key reused with another body (idempotency_conflict). Conflicts
        do not partially change application/decision/offer/events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_status:
              value:
                error: invalid_status
                message: Действие недоступно в текущем статусе заявки.
            version_conflict:
              value:
                error: version_conflict
                message: Заявка была изменена. Обновите данные.
            offer_not_active:
              value:
                error: offer_not_active
                message: Предложение больше недоступно.
            idempotency_conflict:
              value:
                error: idempotency_conflict
                message: Ключ идемпотентности уже использован с другим запросом.
