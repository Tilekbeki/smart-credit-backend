  /api/v1/applications/{applicationId}/timeline:
    get:
      x-implementation-status: implemented
      operationId: getApplicationTimeline
      x-roles:
      - CLIENT
      summary: Read the ordered history of the current client’s application
      description: CLIENT с действующим членством; draft виден только создателю. Missing and foreign applications
        both return 404 application_not_found. Events are ordered by increasing sequence. Draft writes record draft_created
        and draft_updated. Submission records APPLICATION_SUBMITTED with the client actorId; processing records
        PROCESSING_STARTED, COMPANY_CHECK_COMPLETED, CREDIT_HISTORY_CHECK_COMPLETED and PRECHECKS_COMPLETED with
        null actorId for system actions. Scoring adds SCORING_STARTED and, only after its result is durably saved,
        SCORING_COMPLETED. These events have null actorId and processing status. Go policy then records DECISION_PROCESSING_STARTED
        with processing status, followed by exactly one of APPLICATION_APPROVED (approved), APPLICATION_REJECTED
        (rejected), COUNTER_OFFER_CREATED (counter_offer) or MANUAL_REVIEW_REQUIRED (manual_review), all with null
        actorId. Retries do not duplicate durable events. Timeline never contains OTP, JWT, internal errors, score,
        factors or editable financial values.
