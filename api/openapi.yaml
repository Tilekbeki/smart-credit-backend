          type: string
          example: Проверьте обязательные поля и документы заявки.
        details:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
                description: Editable application field, company.registrationDate, or documents.BANK_STATEMENT/documents.EQUIPMENT_INVOICE.
              code:
                type: string
                enum:
                - required
                - out_of_range
                - unsupported_purpose
                - product_unavailable
                - business_too_young
                - required_document_missing
                - invalid_value
              message:
                type: string
